<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – EBMS</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="fas fa-bolt"></i>
      <h1>EBMS</h1>
      <p>Electricity Bill Management System</p>
    </div>
    <div th:if="${error}"   class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>
    <div th:if="${message}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${message}"></span></div>
    <form th:action="@{/auth/login}" method="post" class="auth-form">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="pass-wrap">
          <input type="password" name="password" id="pwd" placeholder="Enter password" required>
          <i class="fas fa-eye toggle-pwd" onclick="togglePwd()"></i>
        </div>
      </div>
      <button type="submit" class="btn-primary w-full"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
    <p class="auth-footer">Don't have an account? <a th:href="@{/auth/register}">Register here</a></p>
    <div class="demo-creds">
      <strong>Demo:</strong> admin / admin123
    </div>
  </div>
</div>
<script>
function togglePwd(){
  const p=document.getElementById('pwd');
  p.type=p.type==='password'?'text':'password';
}
</script>
</body>
</html>
