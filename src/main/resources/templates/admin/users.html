<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users – EBMS</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><i class="fas fa-bolt"></i><span>EBMS</span></div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="/admin/customers" class="nav-item"><i class="fas fa-users"></i><span>Customers</span></a>
      <a href="/admin/bills"     class="nav-item"><i class="fas fa-file-invoice"></i><span>Bills</span></a>
      <a href="/admin/users"     class="nav-item active"><i class="fas fa-user-cog"></i><span>Users</span></a>
      <a href="/auth/logout"     class="nav-item logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="topbar-title"><i class="fas fa-user-cog"></i> User Management</div>
      <div class="topbar-right">
        <button class="dark-toggle" onclick="toggleDark()"><i class="fas fa-moon"></i></button>
        <span class="user-badge"><i class="fas fa-user-shield"></i> <span sec:authentication="name">Admin</span></span>
      </div>
    </header>
    <div class="content">
      <div th:if="${success}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${success}"></span></div>
      <div th:if="${error}"   class="alert alert-danger"><i class="fas fa-times-circle"></i> <span th:text="${error}"></span></div>

      <!-- Add User -->
      <div class="card">
        <div class="card-header"><i class="fas fa-user-plus"></i> Add New User</div>
        <div class="card-body">
          <form th:action="@{/admin/users/add}" method="post" class="form-grid">
            <div class="form-group"><label>Username *</label><input name="username" required minlength="4" maxlength="20"></div>
            <div class="form-group"><label>Full Name *</label><input name="fullName" required></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Password *</label><input type="password" name="password" required minlength="6"></div>
            <div class="form-group"><label>Phone</label><input name="phone" pattern="[0-9]{10}"></div>
            <div class="form-group">
              <label>Role *</label>
              <select name="role" required>
                <option value="CUSTOMER">Customer</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
            <div class="form-group form-submit"><button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Add User</button></div>
          </form>
        </div>
      </div>

      <!-- Users Table -->
      <div class="card">
        <div class="card-header"><i class="fas fa-list"></i> All Users (<span th:text="${#lists.size(users)}">0</span>)</div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>#</th><th>Username</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody>
                <tr th:each="u,i : ${users}">
                  <td th:text="${i.count}"></td>
                  <td><strong th:text="${u.username}"></strong></td>
                  <td th:text="${u.fullName}"></td>
                  <td th:text="${u.email}"></td>
                  <td th:text="${u.phone}"></td>
                  <td><span class="badge" th:classappend="${u.role.name()=='ADMIN'?'badge-info':'badge-success'}" th:text="${u.role}"></span></td>
                  <td th:text="${#temporals.format(u.createdAt,'dd-MM-yyyy')}"></td>
                  <td>
                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Delete user?')">
                      <button class="btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
