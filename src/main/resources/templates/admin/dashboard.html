<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard – EBMS</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="layout" id="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><i class="fas fa-bolt"></i><span>EBMS</span></div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-item active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="/admin/customers" class="nav-item"><i class="fas fa-users"></i><span>Customers</span></a>
      <a href="/admin/bills"     class="nav-item"><i class="fas fa-file-invoice"></i><span>Bills</span></a>
      <a href="/admin/users"     class="nav-item"><i class="fas fa-user-cog"></i><span>Users</span></a>
      <a href="/auth/logout"     class="nav-item logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="topbar-title"><i class="fas fa-tachometer-alt"></i> Admin Dashboard</div>
      <div class="topbar-right">
        <button class="dark-toggle" onclick="toggleDark()" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
        <span class="user-badge"><i class="fas fa-user-shield"></i> <span sec:authentication="name">Admin</span></span>
      </div>
    </header>

    <div class="content">
      <!-- Alerts -->
      <div th:if="${success}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${success}"></span></div>

      <!-- Due Soon Banner -->
      <div th:if="${#lists.size(dueSoon) > 0}" class="alert alert-warning">
        <i class="fas fa-clock"></i>
        <span th:text="'⚠️ ' + ${#lists.size(dueSoon)} + ' bill(s) due within 3 days!'"></span>
      </div>

      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card blue">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-info"><span th:text="${totalCustomers}">0</span><p>Total Customers</p></div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon"><i class="fas fa-file-invoice"></i></div>
          <div class="stat-info"><span th:text="${totalBills}">0</span><p>Total Bills</p></div>
        </div>
        <div class="stat-card teal">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info"><span th:text="${paidBills}">0</span><p>Paid Bills</p></div>
        </div>
        <div class="stat-card orange">
          <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
          <div class="stat-info"><span th:text="${pendingBills}">0</span><p>Pending Bills</p></div>
        </div>
        <div class="stat-card red">
          <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-info"><span th:text="${overdueBills}">0</span><p>Overdue Bills</p></div>
        </div>
        <div class="stat-card purple">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-info"><span th:text="'₹' + ${totalRevenue}">₹0</span><p>Total Revenue</p></div>
        </div>
      </div>

      <!-- Chart -->
      <div class="card">
        <div class="card-header"><i class="fas fa-chart-bar"></i> Monthly Revenue</div>
        <div class="card-body"><canvas id="revenueChart" height="80"></canvas></div>
      </div>

      <!-- Recent Bills -->
      <div class="card">
        <div class="card-header"><i class="fas fa-history"></i> Recent Bills</div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>Bill No</th><th>Customer</th><th>Units</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead>
              <tbody>
                <tr th:each="bill : ${recentBills}">
                  <td th:text="${bill.billNumber}"></td>
                  <td th:text="${bill.customer.name}"></td>
                  <td th:text="${bill.unitsConsumed}"></td>
                  <td th:text="'₹' + ${bill.totalAmount}"></td>
                  <td th:text="${bill.dueDate}"></td>
                  <td><span class="badge" th:classappend="${bill.status=='PAID'?'badge-success':bill.status=='OVERDUE'?'badge-danger':'badge-warning'}"
                            th:text="${bill.status}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentBills)}">
                  <td colspan="6" class="text-center">No bills yet</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const labels  = /*[[${chartLabels}]]*/ [];
  const amounts = /*[[${chartAmounts}]]*/ [];
  new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Revenue (₹)',
        data: amounts,
        backgroundColor: 'rgba(30,136,229,0.7)',
        borderColor: 'rgba(30,136,229,1)',
        borderWidth: 2,
        borderRadius: 6
      }]
    },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
